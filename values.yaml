image: gitea/gitea:1.24.6-rootless
imagePullPolicy: Always

admin:
  enabled: true
  secretName: gitea-admin
  usernameKey: username
  passwordKey: password
  emailKey: email
  mustChangePassword: false

security:
  # Skip the web install wizard; the init container already runs migrate and creates the admin user.
  installLock: true

mirror:
  enabled: true
  defaultInterval: 24h
  minInterval: 1h
  repos:
    - name: cas-registration
      owner: administrator
      cloneAddr: https://github.com/bcgov/cas-registration.git

openshift:
  enabled: true
valkey:
  enabled: true
postgresql:
  enabled: false
postgresql-ha:
  enabled: false
persistence:
  storageClassName: netapp-file-standard
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

cas-pg:
  postgresCluster:
    storageSize: 5Gi
    postgres:
      replicaCount: 1
    pgbouncer:
      replicaCount: 1
    users:
      - name: gitea
        databases:
          - gitea

service:
  type: ClusterIP
  http:
    port: 3000
    targetPort: 3000

route:
  enabled: true
  host: "cas-gitea.apps.silver.devops.gov.bc.ca"
  tls:
    termination: edge
