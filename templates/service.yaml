apiVersion: v1
kind: Service
metadata:
  name: {{ include "cas-gitea.fullname" . }}
  labels:
{{ include "cas-gitea.labels" . | indent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.http.port }}
      targetPort: {{ .Values.service.http.targetPort }}
      protocol: TCP
  selector:
{{ include "cas-gitea.selectorLabels" . | indent 4 }}
    component: gitea
